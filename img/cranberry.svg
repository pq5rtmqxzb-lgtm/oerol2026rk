<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Cranberry- en heideveld in de duinvallei van Terschelling">
  <defs>
    <linearGradient id="c-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d6d4"/>
      <stop offset="0.6" stop-color="#e1e6d6"/>
      <stop offset="1" stop-color="#eef0e2"/>
    </linearGradient>
    <linearGradient id="c-heath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c5a78"/>
      <stop offset="1" stop-color="#7a4a62"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#c-sky)"/>
  <g fill="#ffffff" opacity="0.6"><ellipse cx="240" cy="86" rx="110" ry="24"/><ellipse cx="330" cy="98" rx="64" ry="16"/><ellipse cx="610" cy="70" rx="90" ry="20"/></g>
  <circle cx="120" cy="92" r="34" fill="#f3e6ad" opacity="0.8"/>

  <!-- dune ridge behind -->
  <path d="M0 250 C 160 218, 340 244, 520 224 C 660 210, 740 240, 800 228 L800 320 L0 320 Z" fill="#9aa56a"/>
  <path d="M0 290 C 180 262, 360 290, 540 272 C 660 260, 740 286, 800 278 L800 360 L0 360 Z" fill="#7c8b57"/>

  <!-- heath / cranberry field -->
  <path d="M0 320 C 200 300, 420 332, 620 312 C 700 305, 760 324, 800 318 L800 500 L0 500 Z" fill="url(#c-heath)"/>
  <!-- mottled heather texture -->
  <g fill="#b06b8c" opacity="0.5">
    <ellipse cx="120" cy="380" rx="44" ry="12"/><ellipse cx="300" cy="410" rx="56" ry="14"/><ellipse cx="520" cy="392" rx="50" ry="13"/><ellipse cx="680" cy="430" rx="60" ry="15"/>
  </g>
  <g fill="#7a4a62" opacity="0.5">
    <ellipse cx="220" cy="450" rx="50" ry="12"/><ellipse cx="440" cy="460" rx="60" ry="14"/><ellipse cx="640" cy="470" rx="56" ry="13"/>
  </g>

  <!-- cranberry sprigs with red berries -->
  <g>
    <g stroke="#41502d" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M150 470 q -10 -40 6 -64"/><path d="M165 470 q 6 -36 24 -52"/>
      <path d="M400 484 q -10 -40 6 -64"/><path d="M416 484 q 8 -36 26 -52"/>
      <path d="M640 478 q -10 -40 6 -64"/><path d="M656 478 q 8 -36 26 -52"/>
    </g>
    <g fill="#cf3a3a">
      <circle cx="156" cy="404" r="6"/><circle cx="190" cy="416" r="6"/><circle cx="172" cy="440" r="5"/>
      <circle cx="406" cy="418" r="6"/><circle cx="442" cy="430" r="6"/><circle cx="420" cy="452" r="5"/>
      <circle cx="646" cy="412" r="6"/><circle cx="682" cy="424" r="6"/><circle cx="660" cy="446" r="5"/>
    </g>
    <g fill="#e85a5a" opacity="0.8">
      <circle cx="154" cy="402" r="2"/><circle cx="404" cy="416" r="2"/><circle cx="644" cy="410" r="2"/>
    </g>
  </g>

  <!-- foreground grass -->
  <g stroke="#41502d" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M60 500 q -4 -30 -10 -46"/><path d="M72 500 q 4 -28 10 -44"/>
    <path d="M730 500 q -4 -30 -10 -46"/><path d="M742 500 q 4 -28 10 -44"/>
  </g>
</svg>
