<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Weids strand met zee en lucht aan de Noordzeekant van Terschelling">
  <defs>
    <linearGradient id="s-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc1cb"/>
      <stop offset="0.55" stop-color="#cfe0dd"/>
      <stop offset="1" stop-color="#eef0e4"/>
    </linearGradient>
    <linearGradient id="s-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c6a78"/>
      <stop offset="0.6" stop-color="#5a8ca0"/>
      <stop offset="1" stop-color="#8fb6bd"/>
    </linearGradient>
    <linearGradient id="s-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d8b2"/>
      <stop offset="1" stop-color="#cba85f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#s-sky)"/>
  <circle cx="160" cy="110" r="46" fill="#f6eccb" opacity="0.85"/>
  <g fill="#ffffff" opacity="0.5"><ellipse cx="560" cy="80" rx="120" ry="22"/><ellipse cx="650" cy="92" rx="70" ry="15"/></g>

  <!-- sea -->
  <rect x="0" y="226" width="800" height="120" fill="url(#s-sea)"/>
  <!-- breaking wave lines -->
  <g fill="#eef4f1" opacity="0.7">
    <path d="M0 318 q 100 -10 200 0 t 200 0 t 200 0 t 200 0 l0 12 q -100 10 -200 0 t -200 0 t -200 0 t -200 0 Z"/>
  </g>
  <g opacity="0.4" fill="#cfe2e0"><rect x="80" y="250" width="180" height="3" rx="1.5"/><rect x="420" y="270" width="220" height="3" rx="1.5"/></g>

  <!-- wet sand reflecting -->
  <path d="M0 338 C 220 326, 420 352, 620 336 C 700 330, 760 346, 800 340 L800 392 L0 392 Z" fill="#bcae8e"/>
  <!-- dry beach -->
  <path d="M0 380 C 220 366, 420 396, 620 380 L800 384 L800 500 L0 500 Z" fill="url(#s-sand)"/>
  <!-- ripple lines in sand -->
  <g stroke="#bd9a52" stroke-width="2" opacity="0.4" fill="none">
    <path d="M60 430 q 120 -12 240 0 t 240 0 t 240 0"/>
    <path d="M40 456 q 120 -12 240 0 t 240 0 t 240 0"/>
    <path d="M80 482 q 120 -12 240 0 t 240 0 t 240 0"/>
  </g>
  <!-- shells / pebbles -->
  <g fill="#fff" opacity="0.8"><ellipse cx="180" cy="440" rx="5" ry="3"/><ellipse cx="520" cy="468" rx="6" ry="3.5"/></g>
  <g fill="#9c5a78" opacity="0.6"><ellipse cx="300" cy="470" rx="4" ry="2.6"/><ellipse cx="640" cy="446" rx="4" ry="2.6"/></g>

  <!-- distant beach pole (strandpaal) -->
  <g transform="translate(700 300)"><rect x="0" y="0" width="6" height="60" fill="#5a4d3a"/><rect x="-6" y="0" width="18" height="10" fill="#cf6b43"/></g>

  <!-- gulls -->
  <g stroke="#2f2a26" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M260 150 q 12 -10 24 0 q 12 -10 24 0"/>
    <path d="M360 130 q 9 -8 18 0 q 9 -8 18 0"/>
    <path d="M440 162 q 8 -7 16 0 q 8 -7 16 0"/>
  </g>
</svg>
