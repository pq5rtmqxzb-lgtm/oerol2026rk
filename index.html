<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Oerall — onze Oerol 2026</title>
  <meta name="description" content="Oerall — de go-to app voor onze Oerol op Terschelling. Programma, het huis, de kaart en de route naar het volgende evenement." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#3C6A78" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15130F" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Oerall" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

  <!-- Fonts (with system fallback if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo">Oer<em>all</em></span>
      <span class="topbar__sub" id="topbar-sub">Terschelling in beeld · Oerol 2026</span>
    </div>
    <a class="topbar__ext" id="topbar-krant" href="#" target="_blank" rel="noopener" title="Oerol Krant">📰</a>
  </header>

  <!-- Page content gets rendered here -->
  <main id="app" class="app" tabindex="-1">
    <div class="skeleton" aria-label="Laden…" role="status">
      <div class="sk sk--hero"></div>
      <div class="sk sk--bar"></div>
      <div class="sk sk--row"></div>
      <div class="sk sk--row"></div>
      <div class="sk sk--row"></div>
    </div>
  </main>

  <!-- Bottom tab navigation -->
  <nav class="tabbar" id="tabbar" aria-label="Hoofdnavigatie">
    <a class="tab" data-route="today" href="#/today">
      <span class="tab__icon">☀️</span><span class="tab__label">Vandaag</span>
    </a>
    <a class="tab" data-route="events" href="#/events">
      <span class="tab__icon">🎭</span><span class="tab__label">Programma</span>
    </a>
    <a class="tab" data-route="map" href="#/map">
      <span class="tab__icon">🗺️</span><span class="tab__label">Kaart</span>
    </a>
    <a class="tab" data-route="home" href="#/home">
      <span class="tab__icon">🏠</span><span class="tab__label">Thuis</span>
    </a>
    <a class="tab" data-route="more" href="#/more">
      <span class="tab__icon">✨</span><span class="tab__label">Meer</span>
    </a>
  </nav>

  <!-- Scripts (plain, no build step) -->
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.warn("SW registration failed", e);
        });
      });
    }
  </script>
</body>
</html>
