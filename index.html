<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Oerall — onze Oerol 2026</title>
  <meta name="description" content="Oerall — de go-to app voor onze Oerol op Terschelling. Programma, het huis, de kaart en de route naar het volgende evenement." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#3C6A78" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15130F" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Oerall" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

  <!-- Fonts (with system fallback if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo">Oer<em>all</em></span>
      <span class="topbar__sub" id="topbar-sub">Terschelling in beeld · Oerol 2026</span>
    </div>
    <a class="topbar__ext" id="topbar-krant" href="#" target="_blank" rel="noopener" title="Oerol Krant" aria-label="Oerol Krant"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h13v13a1.5 1.5 0 0 1-1.5 1.5H5a1 1 0 0 1-1-1Z"/><path d="M17 9h3v9.5a1.5 1.5 0 0 1-1.5 1.5"/><path d="M7 9h7M7 12.3h7M7 15.6h4.5"/></svg></a>
  </header>

  <!-- Page content gets rendered here -->
  <main id="app" class="app" tabindex="-1">
    <div class="skeleton" aria-label="Laden…" role="status">
      <div class="sk sk--hero"></div>
      <div class="sk sk--bar"></div>
      <div class="sk sk--row"></div>
      <div class="sk sk--row"></div>
      <div class="sk sk--row"></div>
    </div>
  </main>

  <!-- Bottom tab navigation -->
  <nav class="tabbar" id="tabbar" aria-label="Hoofdnavigatie">
    <a class="tab" data-route="today" href="#/today">
      <span class="tab__icon"><svg class="ic tab__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.3"/><path d="M12 2.6v2.4M12 19v2.4M21.4 12H19M5 12H2.6M18.7 5.3l-1.7 1.7M7 17l-1.7 1.7M18.7 18.7 17 17M7 7 5.3 5.3"/></svg></span><span class="tab__label">Vandaag</span>
    </a>
    <a class="tab" data-route="events" href="#/events">
      <span class="tab__icon"><svg class="ic tab__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6.5v6c0 3-1.6 5-3.25 5S4 14 4 11Z"/><path d="M13.5 5H20v6c0 3-1.6 5-3.25 5S13.5 14 13.5 11Z"/><path d="M6 9.2h2.5M15.5 9.2H18"/><path d="M5.6 12.6c.6.9 2.2.9 2.8 0M15.6 12.6c.6.9 2.2.9 2.8 0"/></svg></span><span class="tab__label">Programma</span>
    </a>
    <a class="tab" data-route="map" href="#/map">
      <span class="tab__icon"><svg class="ic tab__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.2v13.8l6-2.2 6 2.2 6-2.2V6l-6 2.2Z"/><path d="M9 4v13.8M15 8.2V22"/><circle cx="6" cy="10" r="1" fill="currentColor" stroke="none"/></svg></span><span class="tab__label">Kaart</span>
    </a>
    <a class="tab" data-route="home" href="#/home">
      <span class="tab__icon"><svg class="ic tab__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></span><span class="tab__label">Thuis</span>
    </a>
    <a class="tab" data-route="more" href="#/more">
      <span class="tab__icon"><svg class="ic tab__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="m14.8 9.2-1.9 5-5 1.9 1.9-5Z" fill="currentColor" fill-opacity=".16"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg></span><span class="tab__label">Meer</span>
    </a>
  </nav>

  <!-- Scripts (plain, no build step) -->
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.warn("SW registration failed", e);
        });
      });
    }
  </script>
</body>
</html>
